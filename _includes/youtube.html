{% comment %}
  Responsive 16:9 YouTube embed.
  Usage: {% include youtube.html id="O6-PbTPAFXw" start="327" title="Talk title" %}
{% endcomment %}
<div class="video">
  <iframe src="https://www.youtube-nocookie.com/embed/{{ include.id }}{% if include.start %}?start={{ include.start }}{% endif %}"
          title="{{ include.title | default: 'YouTube video' }}"
          loading="lazy"
          allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen></iframe>
</div>

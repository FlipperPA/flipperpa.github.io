<header class="site-header">
  <div class="wrapper">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav" aria-label="Main">
      {% for item in site.data.navigation %}
        {% assign current = false %}
        {% if item.match == page.section %}{% assign current = true %}{% endif %}
        <a href="{{ item.url | relative_url }}"{% if current %} class="active" aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>

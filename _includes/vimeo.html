{% comment %}
  Responsive 16:9 Vimeo embed.
  Usage: {% include vimeo.html id="123456789" title="Talk title" %}
{% endcomment %}
<div class="video">
  <iframe src="https://player.vimeo.com/video/{{ include.id }}"
          title="{{ include.title | default: 'Vimeo video' }}"
          loading="lazy"
          allow="fullscreen; picture-in-picture"
          allowfullscreen></iframe>
</div>

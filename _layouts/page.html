---
layout: default
---
<article class="wrapper post">
  {% if page.hero %}
    <div class="hero" style="background-image: url('{{ page.hero | relative_url }}')" role="img" aria-label=""></div>
  {% endif %}

  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.description %}<p class="lead">{{ page.description }}</p>{% endif %}
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>
